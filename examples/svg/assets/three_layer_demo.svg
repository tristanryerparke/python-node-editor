<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Layer 1: Background -->
  <g id="background-layer">
    <rect width="400" height="300" fill="#e3f2fd"/>
    <circle cx="80" cy="80" r="40" fill="#90caf9" opacity="0.5"/>
    <circle cx="320" cy="220" r="50" fill="#64b5f6" opacity="0.5"/>
  </g>

  <!-- Layer 2: Middle Layer -->
  <g id="middle-layer">
    <rect x="100" y="80" width="200" height="140" fill="#42a5f5" rx="10"/>
    <polygon points="200,60 240,100 200,140 160,100" fill="#1e88e5"/>
  </g>

  <!-- Layer 3: Foreground -->
  <g id="foreground-layer">
    <circle cx="200" cy="150" r="30" fill="#fff176" stroke="#fbc02d" stroke-width="3"/>
    <text x="200" y="260" font-family="Arial, sans-serif" font-size="20" fill="#0d47a1" text-anchor="middle">Three Layers</text>
  </g>
</svg>
